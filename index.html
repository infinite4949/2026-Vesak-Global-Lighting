    // --- 地圖初始化：修正重複國家問題 ---
    const map = L.map('map', {
        worldCopyJump: false, // 關閉世界跳轉
        minZoom: 2,
        maxBounds: [[-90, -180], [90, 180]], // 限制範圍防止地圖無限重複
        maxBoundsViscosity: 1.0
    }).setView([20, 0], 2);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        noWrap: true // 關鍵：防止底圖重複拼貼
    }).addTo(map);

    // 點擊地圖：存入 Firebase
    map.on('click', (e) => {
        const q = quotes[Math.floor(Math.random() * quotes.length)];
        push(pointsRef, { lat: e.latlng.lat, lng: e.latlng.lng, q_zh: q.zh, q_en: q.en });
    });

    // 顯示蓮花：修正顯示邏輯
    onChildAdded(pointsRef, (data) => {
        const val = data.val();
        
        // 1. 定義蓮花圖示 (使用 Emoji 避開圖檔路徑問題)
        const lotusIcon = L.divIcon({ 
            className: 'lotus-marker', 
            html: '🪷', 
            iconSize: [40, 40], 
            iconAnchor: [20, 20] 
        });

        // 2. 建立標記並使用上述圖示
        const marker = L.marker([val.lat, val.lng], { icon: lotusIcon }).addTo(map);
        
        // 3. 綁定菜根譚視窗內容
        marker.bindPopup(`
            <div style="padding:5px; text-align:center;">
                <b style="color:gold; font-size:1.1em;">${i18n[currentLang].popup}</b>
                <hr style="border:0; border-top:1px solid #444; margin:8px 0;">
                <p style="margin:0; font-weight:bold; color:white;">${val.q_zh || ""}</p>
                <p style="margin:5px 0 0; font-style:italic; font-size:0.9em; color:#ccc;">${val.q_en || ""}</p>
            </div>
        `);
    });

    // 計數器邏輯
    let lastCount = 0;
    function updateDisplay(count) {
        lastCount = count;
        const area = document.getElementById('stats-area');
        if (area) {
            area.innerHTML = `${i18n[currentLang].countLabel}<span id="count">${count}</span>${i18n[currentLang].unit}`;
        }
    }

    onValue(pointsRef, (snapshot) => {
        updateDisplay(snapshot.size || 0);
    });
</script>
</body>
</html>
